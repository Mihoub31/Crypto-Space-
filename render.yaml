# Ledgerline

Ledgerline is a crypto dashboard and news portal with live market access, token detail views,
portfolio tracking, and a persistent community room.

## Features

- dark mode toggle
- live crypto market data via public CoinGecko API
- search and sort filters for the market table
- token detail panels for selected coins
- portfolio tracker with local storage
- map to a Node.js backend + static deployment setup

## Run locally

```bash
npm install
npm start
```

Open http://localhost:3000

## Deployment

This repo includes deployment configs for:
- Render via `render.yaml`
- Railway via `railway.json`
- Fly.io via `fly.toml`

## Project structure

- `docs/` — frontend assets
- `server.js` — Express server and API endpoints
- `data/chat-room.json` — persisted chat messages
- `render.yaml` — Render deployment config
- `railway.json` — Railway deployment config
- `fly.toml` — Fly.io deployment config
























































































































































































































































































