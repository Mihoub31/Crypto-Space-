{
"name": "Daily crypto gainers",
"on": {"schedule": [{"cron": "0 6 * * *"}], "workflow_dispatch": {}},
"permissions": {"contents": "write"},
"jobs": {"update": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}},
{"name": "Build the page", "env": {"CMC_API_KEY": "${{ secrets.CMC_API_KEY }}"}, "run": "python update_gainers.py"},
{"name": "Save changes", "run": "git config user.name daily-bot\ngit config user.email daily-bot@users.noreply.github.com\ngit add docs\ngit diff --cached --quiet || git commit -m 'Daily update'\ngit push"}
]}}
}
